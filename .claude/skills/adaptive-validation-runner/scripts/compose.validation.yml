# 動作確認用の compose 上書き設定。
# compose.yml と重ねて、プロジェクト名を分けて起動する（ほかの案件や既存の開発環境と衝突させない）。
#
#   docker compose -f compose.yml \
#     -f .claude/skills/adaptive-validation-runner/scripts/compose.validation.yml up -d --build
#
# - プロジェクト名とコンテナ名は EVO_VALIDATE_NAME（既定 evo-validate）から決まる。
#   並走するセッションごとに名前と公開先のアドレス（EVO_BIND_IP。127.0.0.2 など）を変えれば、互いの環境を壊さない。
#   ボリューム・ネットワーク・ビルドしたイメージには compose がプロジェクト名を付けるので、名前を変えれば別になる
# - HTTP のポートは EVO_HTTP_PORT（既定 80）で変えられる。80 以外では、新規インストールでサイトのホスト（site_host）に
#   ポート込みのホストが入る（assets/docs/site-host.md）
# - DB は mariadb:11 を使う。MySQL 公式イメージは土台のレイヤーに dev/ptmx（デバイス番号 5,2）を含み、
#   Docker Engine 29 系ではレイヤー展開時に「openat dev/ptmx: no such file or directory」で取得できない場合がある
#   （詳細は references/environment.md）
# - 既定の管理者パスワードを使うため、HTTP と mailpit はループバックアドレス（既定 127.0.0.1）にだけ公開し、
#   DB と SMTP は外へ公開しない
# - app の DB 接続の環境変数（インストーラーの初期値に使われる）は、シェルの値を引き継がないよう検証用の DB に固定する
name: ${EVO_VALIDATE_NAME:-evo-validate}

services:
  app:
    container_name: ${EVO_VALIDATE_NAME:-evo-validate}-app
    environment:
      DB_HOST: db
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_DATABASE: evodb
      TABLE_PREFIX: ${EVO_TABLE_PREFIX:-modx_}
    ports: !override
      - "${EVO_BIND_IP:-127.0.0.1}:${EVO_HTTP_PORT:-80}:8080"

  db:
    image: mariadb:11
    container_name: ${EVO_VALIDATE_NAME:-evo-validate}-db
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: evodb
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    volumes: !override
      - evo_validate_db:/var/lib/mysql
    ports: !reset []

  mailpit:
    container_name: ${EVO_VALIDATE_NAME:-evo-validate}-mailpit
    ports: !override
      - "${EVO_BIND_IP:-127.0.0.1}:${EVO_MAILPIT_PORT:-8025}:8025"

volumes:
  evo_validate_db:
