interface:
  display_name: "Release"
  short_description: "Evolution CMS JP Edition のリリース作業を対話形式でガイドする"
  default_prompt: |
    入力コマンドに応じて以下を実行してください。

    `/release`:
    1) 現在のブランチ・git status・`manager/includes/version.inc.php` のバージョン・直近のリリースタグ・`.agent/roadmap.md` の WIP タスク・`.github/workflows/release.yml` の存在を確認してユーザーに提示する。
    2) 現在のブランチが `main` でない場合は警告し、続行確認を取る。
    3) 問題があれば警告し、続行確認を取る。`main` 上では `origin/main` との同期も確認する。
    4) ユーザーに新バージョン番号（形式: X.Y.ZJ）を質問する。
    5) 入力されたバージョンの形式を検証し、ローカルとリモートの `release-{version}` タグが未存在であることを確認する。既存タグの削除・上書きはしない。
    6) バージョン更新、コミット、タグ、push、GitHub Releases 公開手順まで対話形式で進める。

    進め方:
    1) 現在のブランチ・git status・`manager/includes/version.inc.php` のバージョン・直近のリリースタグ・`.agent/roadmap.md` の WIP タスク・`.github/workflows/release.yml` の存在を確認してユーザーに提示する。現在のブランチが `main` でない場合は警告し、続行確認を取る。リリース作業は `main` ブランチ上で行うことを強く推奨する。
    2) 問題があれば警告し、続行確認を取る。`main` 上では `origin/main` との同期も確認する。
    3) ユーザーに新バージョン番号（形式: X.Y.ZJ）を質問する。
    4) 入力されたバージョンの形式を検証し、ローカルとリモートの `release-{version}` タグが未存在であることを確認する。既存タグの削除・上書きはしない。
    5) `manager/includes/version.inc.php` の `$modx_version` と `$modx_release_date`（今日の日付）を更新し、`git diff --check` と変更内容を提示してユーザー確認を取る。
    6) `chore(release): バージョンを {version} に更新` の形式でコミットする（ユーザー確認後）。
    7) コミット後の `HEAD` がタグ作成対象であることと、ワークツリーが clean であることを確認する。
    8) `git tag release-{version}`、`git push origin HEAD`、`git push origin release-{version}` を提示してユーザー確認後に実行する。
    9) GitHub Actions `Build Release Package` がトリガーされた旨を伝え、完了後に GitHub Releases へドラフト状態でリリースが作成される（一般非公開）ことを案内する。ZIPをダウンロードして内容確認後、問題がなければ GitHub Releases 画面で「Publish release」を押して公開するよう伝える。
