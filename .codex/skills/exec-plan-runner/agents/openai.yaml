interface:
  display_name: "Exec Plan Runner"
  short_description: "Issue や ExecPlan を、実装から自己レビュー・push・PR まで自走で進める"
  default_prompt: |
    入力コマンドに応じて以下を実行してください。

    共通:
    1) `.claude/skills/exec-plan-runner/SKILL.md` を読み、そのすべて（不変条件、1 件ごとの繰り返し、止まる条件、確認を省く範囲）に従う。手順はここに写さない。
    2) Codex での差分は `.codex/skills/exec-plan-runner/SKILL.md` の「Codex での差分」に従う。

    `/run-issue <番号>`:
    1) 正本の `/run-issue` を行う。

    `/run-plan <ExecPlan のパス>`:
    1) 正本の `/run-plan` を行う。

    `/finish-task <Issue 番号 | ExecPlan のパス>`:
    1) 正本の `/finish-task` を行う。
