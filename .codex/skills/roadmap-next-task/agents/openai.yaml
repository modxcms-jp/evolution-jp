interface:
  display_name: "Roadmap Next Task"
  short_description: "ロードマップから次タスクを選び、改修規模に応じてExecPlanを作って着手する"
  default_prompt: |
    入力コマンドに応じて以下を実行してください。

    `/next-task`:
    1) `.agent/roadmap.md` を読み、すでに実装と検証が完了し、ユーザー確認済みなのに未同期の項目があれば先に `/sync-roadmap` を実行して完了同期する。
    2) ロードマップの上から次に着手すべき `Status: NEXT` のタスクを1件選定する（非公開のセキュリティ修正は対象外）。
    3) `ExecPlan:` が `着手時に判断` か未記入なら、`.agent/roadmap.md` の目安で要否を決める。作る場合は `.agent/PLANS.md` 準拠で作成してパスを書き、作らない場合は `不要` にして `Issue:` の Issue を正とする。
    4) ExecPlan がある場合は `Progress` と検証手順を更新する。そのうえで対象タスクを `Status: WIP` にしてから実装に着手する。

    `/sync-roadmap`:
    1) 実装と検証が完了し、ユーザー確認済みの項目を `.agent/PLANS.md` の「完了処理プロトコル」に従って同期する。

    `/finish-task`:
    1) ExecPlan がある場合は `Progress` と `Validation and Acceptance` を完了状態に更新する。無い場合は `Issue:` の Issue が閉じたかを確認する。
    2) 実装と検証の完了を告げ、ロードマップ反映前にユーザー確認を求める。
    3) ユーザー確認後に `/sync-roadmap` を実行する。
    4) スキル自己成長対象タスクでは、`.agent/PLANS.md` の「完了処理プロトコル」step 8 に従い、`skill:complete` 実行後に得られた学びと反映候補を示してから、`この学びをスキルへ反映しますか？ はい・いいえ` と確認する。

    共通ルール:
    1) `.agent/roadmap.md` を読み、すでに実装と検証が完了し、ユーザー確認済みなのに未同期の項目があれば先に `/sync-roadmap` を実行して完了同期する。
    2) ロードマップの上から次に着手すべき `Status: NEXT` のタスクを1件選定する（非公開のセキュリティ修正は対象外）。
    3) `ExecPlan:` が `着手時に判断` か未記入なら、`.agent/roadmap.md` の目安で要否を決める。作る場合は `.agent/PLANS.md` 準拠で作成してパスを書き、作らない場合は `不要` にして `Issue:` の Issue を正とする。
    4) ExecPlan がある場合は `Progress` と検証手順を更新する。そのうえで対象タスクを `Status: WIP` にしてから実装に着手する。
    5) 実装と検証の完了後は完了を告げてユーザー確認を求め、確認後に `.agent/PLANS.md` の「完了処理プロトコル」に従って対象タスク・親タスク・ExecPlan を同期する。
