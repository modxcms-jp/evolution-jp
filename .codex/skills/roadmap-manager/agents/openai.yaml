interface:
  display_name: "Roadmap Manager"
  short_description: "ロードマップの追加・変更・削除・着手・完了同期を管理する"
  default_prompt: |
    入力コマンドに応じて以下を実行してください。

    `/roadmap-next`:
    1) ロードマップの上から次の未完了タスクを1件選定する（非公開のセキュリティ修正は対象外）。
    2) `ExecPlan:` が `着手時に判断` か未記入なら、`.agent/roadmap.md` の目安で要否を決める。作る場合は `.agent/PLANS.md` 準拠で作成してパスを書き、作らない場合は `不要` にして `Issue:` の Issue を正とする。
    3) ExecPlan を作った場合は `Progress` 初期行を更新して着手する。

    `/roadmap-add <セクション> <タスク>`:
    1) 指定セクション配下へ固定フォーマットでタスクを追加する。
    2) `Issue:` に Issue 番号を書く（無ければ `未起票`）。`ExecPlan:` は `着手時に判断` とし、この時点では作らない。

    `/roadmap-update <対象> <変更内容>`:
    1) 対象タスクの項目を更新する。
    2) 既存 ExecPlan の目的・検証条件と矛盾しないよう同期する。

    `/roadmap-remove <対象>`:
    1) 対象タスクをロードマップから削除する。
    2) 対応 ExecPlan がある場合はアーカイブ扱いにする。

    `/roadmap-sync`:
    1) 実装・検証結果に基づき `Status` と完了同期を更新する。
    2) `Status: DONE` はユーザー確認後にのみ反映する。

    `/roadmap-normalize`:
    1) 旧ToDo形式の項目を固定フォーマットへ変換する。

    共通ルール:
    1) `.agent/roadmap.md` を正本として現在状態を確認する。
    2) 依頼種別（追加 / 変更 / 削除 / 次タスク着手 / 完了同期）を判定する。
    3) タスク記述は `.agent/roadmap.md` の「記述フォーマット（固定）」を使う（標準の形、または不具合修正のまとめ向けの短い形）。
    4) 着手時は `ExecPlan:` が `着手時に判断` か未記入なら、`.agent/roadmap.md` の目安で要否を決める。作る場合は `.agent/PLANS.md` 準拠で作成してパスを書き、作らない場合は `不要` にして `Issue:` の Issue を正とする。
    5) 非公開で扱うセキュリティ修正はロードマップの項目にしない。
    6) ロードマップと ExecPlan の整合を保ったまま更新する。
    7) 実装と検証の完了後は完了を告げてユーザー確認を求め、確認後に `.agent/PLANS.md` の「完了処理プロトコル」に従って完了同期する。
