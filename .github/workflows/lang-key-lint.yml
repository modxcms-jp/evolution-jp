name: Language key lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lang_key_lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest に入っている PHP をそのまま使う（言語ファイルを読むだけで拡張は要らない）
      - name: Run language key lint
        run: php .github/scripts/lang-key-lint.php
