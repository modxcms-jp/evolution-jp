name: Security lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security_lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest に入っている PHP をそのまま使う（字句解析だけなので拡張は要らない）
      - name: Run security lint
        run: php .github/scripts/security-lint.php
